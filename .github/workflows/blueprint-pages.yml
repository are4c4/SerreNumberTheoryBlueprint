name: Blueprint Pages Reusable

on:
  workflow_call:
    inputs:
      checkout_submodules:
        required: false
        type: boolean
        default: false
      harness_enabled:
        required: false
        type: boolean
        default: false
      warm_dependency_cache:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Blueprint Site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - if: ${{ inputs.checkout_submodules }}
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - if: ${{ !inputs.checkout_submodules }}
        uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - if: ${{ inputs.harness_enabled }}
        name: Read harness config
        id: harness
        run: python3 tools/verso-harness/scripts/export_ci_env.py --project-root . >> "$GITHUB_OUTPUT"
      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache@v5
        with:
          # Cache the complete Lake dependency tree, including compiled outputs
          # for transitive Verso dependencies such as Illuminate and MD4Lean.
          path: .lake/packages
          key: ${{ runner.os }}-lake-packages-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v3-
            ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.gitmodules') }}
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore root Lean build cache
        uses: actions/cache@v5
        with:
          # Keep executables and generated facets as well as lib/ir so a prior
          # build can be reused incrementally after a source-only change.
          path: .lake/build
          key: ${{ runner.os }}-lean-build-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules') }}-${{ hashFiles('*.lean', 'SerreNumberTheory/**/*.lean', 'MiniBlueprint/**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-lean-build-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules') }}-
            ${{ runner.os }}-lean-build-v3-
            ${{ runner.os }}-lean-build-v2-
      - if: ${{ inputs.harness_enabled }}
        name: Restore formalization Lean build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.harness.outputs.formalization_path }}/.lake/build/lib
            ${{ steps.harness.outputs.formalization_path }}/.lake/build/ir
          key: ${{ runner.os }}-formalization-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules', '*.lean', '**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-formalization-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules') }}-
            ${{ runner.os }}-formalization-build-v1-
      - name: Show tool versions
        run: |
          lean --version
          lake --version
          python3 --version
          git submodule status || true
      - if: ${{ inputs.warm_dependency_cache && steps.lake-package-cache.outputs.cache-hit != 'true' }}
        name: Warm Lean dependency cache
        timeout-minutes: 20
        run: |
          if ! lake exe cache get; then
            echo "::warning::Mathlib dependency cache download failed; the following build may need a cold compile."
          fi
          if [ "${{ inputs.harness_enabled }}" = "true" ] && [ -f "${{ steps.harness.outputs.formalization_path }}/lakefile.lean" ]; then
            (
              cd "${{ steps.harness.outputs.formalization_path }}"
              if ! lake exe cache get; then
                echo "::warning::Formalization dependency cache download failed; the following build may need a cold compile."
              fi
            )
          fi
      - if: ${{ inputs.harness_enabled }}
        name: Select harness Lean toolchain
        run: |
          formalization_toolchain="${{ steps.harness.outputs.formalization_path }}/lean-toolchain"
          if [ -f "$formalization_toolchain" ]; then
            cp "$formalization_toolchain" lean-toolchain
          fi
      - if: ${{ inputs.harness_enabled }}
        name: Validate harness contract
        run: python3 tools/verso-harness/scripts/check_harness.py --project-root .
      - name: Build Verso Blueprint site
        timeout-minutes: 30
        run: lake exe vbp build
      - name: Build semantic highlights
        timeout-minutes: 30
        run: |
          lake build SerreNumberTheory:highlighted
          lake build notion-highlight-export
      - name: Assemble Notion viewer and Pages output
        timeout-minutes: 10
        run: |
          # Keep scripts/ci-pages.sh usable as the one-shot local build command,
          # while CI runs the expensive Lean build commands as separate steps so
          # a slow or stuck phase is immediately visible in the Actions UI.
          for command in \
            'lake exe vbp build' \
            'lake build SerreNumberTheory:highlighted' \
            'lake build notion-highlight-export'
          do
            if ! grep -Fxq "$command" scripts/ci-pages.sh; then
              echo "::error::Expected command missing from scripts/ci-pages.sh: $command"
              exit 1
            fi
          done
          sed \
            -e '/^lake exe vbp build$/d' \
            -e '/^lake build SerreNumberTheory:highlighted$/d' \
            -e '/^lake build notion-highlight-export$/d' \
            scripts/ci-pages.sh > "$RUNNER_TEMP/ci-pages-assemble.sh"
          bash "$RUNNER_TEMP/ci-pages-assemble.sh"
      - name: Export theorem proof status
        timeout-minutes: 10
        run: |
          lake env lean ProofStatusExport.lean
          python3 scripts/add-proof-status-ui.py
          test -f _out/site/html-multi/proof-status.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _out/site/html-multi

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
