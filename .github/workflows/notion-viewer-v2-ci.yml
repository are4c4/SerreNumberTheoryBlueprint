name: Notion Viewer v2 CI

on:
  push:
    branches:
      - feature/notion-viewer-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: ${{ runner.os }}-notion-v2-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-notion-v2-packages-

      - if: ${{ steps.lake-package-cache.outputs.cache-hit != 'true' }}
        name: Warm mathlib cache
        timeout-minutes: 20
        run: |
          if ! lake exe cache get; then
            echo "::warning::Mathlib cache download failed; continuing with a normal build."
          fi

      - name: Build static Notion viewer
        timeout-minutes: 25
        run: ./scripts/build-notion-v2.sh

      - name: Upload viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: notion-viewer-v2
          path: _out/notion-v2
