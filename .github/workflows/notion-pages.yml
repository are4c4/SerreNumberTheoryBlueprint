name: Notion Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-notion-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Notion Viewer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-packages-notion-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-notion-
            ${{ runner.os }}-lake-packages-v3-

      - name: Verify dependency manifest
        run: |
          cp lake-manifest.json "$RUNNER_TEMP/lake-manifest.before.json"
          lake update
          python3 - "$RUNNER_TEMP/lake-manifest.before.json" lake-manifest.json <<'PY'
          import json
          import sys

          def normalized(path):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              data["packages"] = sorted(data.get("packages", []), key=lambda p: p.get("name", ""))
              return data

          before = normalized(sys.argv[1])
          after = normalized(sys.argv[2])
          if before != after:
              print("::error::lake-manifest.json has a semantic dependency change.")
              print("Before:")
              print(json.dumps(before, indent=2, ensure_ascii=False))
              print("After:")
              print(json.dumps(after, indent=2, ensure_ascii=False))
              raise SystemExit(1)
          PY

      - name: Restore Lean build cache
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-build-notion-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'SerreNumberTheory.lean', 'SerreNumberTheory/**/*.lean', 'NotionHighlightExport.lean', 'NotionProofStatusExport.lean', 'scripts/build-notion.*') }}
          restore-keys: |
            ${{ runner.os }}-lean-build-notion-

      - if: ${{ steps.lake-package-cache.outputs.cache-hit != 'true' }}
        name: Warm mathlib cache
        timeout-minutes: 20
        run: |
          if ! lake exe cache get; then
            echo "::warning::Mathlib cache download failed; continuing with a normal build."
          fi

      - name: Build Notion Viewer
        timeout-minutes: 25
        run: ./scripts/build-notion.sh

      - name: Create Pages landing page
        run: |
          cat > _out/site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=notion/">
            <title>Lean Notion Viewer</title>
          </head>
          <body><a href="notion/">Open Lean Notion Viewer</a></body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _out/site

  deploy:
    name: Deploy Notion Viewer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
