name: Blueprint Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    # Reusable workflow builds and deploys the Blueprint site.
    uses: ./.github/workflows/blueprint-pages.yml
    with:
      warm_dependency_cache: true
    secrets: inherit
