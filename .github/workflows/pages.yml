name: Blueprint Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Blueprint Site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-packages-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v1-

      - name: Restore Lean build cache
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '*.lean', 'SerreNumberTheory/**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-lean-build-v1-

      - if: ${{ steps.lake-package-cache.outputs.cache-hit != 'true' }}
        name: Warm mathlib cache
        timeout-minutes: 20
        run: |
          if ! lake exe cache get; then
            echo "::warning::Mathlib cache download failed; continuing with a normal build."
          fi

      - name: Build Blueprint
        timeout-minutes: 30
        run: ./scripts/ci-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _out/site/html-multi

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
