<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lean Notion URL Generator</title>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--panel:#181818;--panel2:#252526;--border:#3c3c3c;--text:#d4d4d4;--muted:#999;--accent:#4fc1ff;--ok:#6a9955;--bad:#f48771}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:0 auto;padding:28px 18px 50px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}h1{font-size:22px;margin:5px 0 8px}.lead{margin:0 0 20px;color:#bcbcbc;font-size:13px;line-height:1.7}.label{display:block;font-size:12px;margin:16px 0 7px;color:#bbb}.row{display:flex;gap:8px}.row input{flex:1}.input,select{width:100%;background:#1e1e1e;border:1px solid #4a4a4a;border-radius:7px;color:var(--text);padding:10px 11px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}.input:focus,select:focus{border-color:#007acc}.btn{border:1px solid #4a4a4a;border-radius:7px;background:var(--panel2);color:#ddd;padding:9px 12px;cursor:pointer;white-space:nowrap}.btn.primary{background:#0e639c;border-color:#1177bb;color:#fff}.btn:hover{filter:brightness(1.12)}.status{font-size:12px;min-height:20px;margin:10px 0;color:var(--muted)}.status.ok{color:#8ccf7e}.status.bad{color:var(--bad)}.result{display:none;margin-top:18px;border-top:1px solid var(--border);padding-top:18px}.meta{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12px;margin-bottom:14px}.meta .k{color:var(--muted)}.meta .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.candidate{margin:10px 0;padding:10px;border:1px solid var(--border);border-radius:8px;background:#202020}.candidate label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}.candidate strong{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace}.candidate small{display:block;color:var(--muted);margin-top:3px}.out{display:flex;gap:8px;margin-top:8px}.out input{flex:1}.hint{font-size:11px;color:#888;margin-top:14px;line-height:1.6}.home{display:inline-block;margin-bottom:14px;color:#8cc8ff;text-decoration:none;font-size:12px}
@media(max-width:650px){.row,.out{flex-direction:column}.meta{grid-template-columns:1fr}.meta .k{margin-top:4px}}
</style>
</head>
<body><div class="wrap">
<a class="home" href="../">← Lean Code Viewer</a>
<div class="card">
<div class="eyebrow">SerreNumberTheoryBlueprint</div>
<h1>GitHub → Notion表示URL</h1>
<p class="lead">GitHubで表示したいコードの行番号をクリックし、アドレスバーのURLをここへ貼り付けてください。定理・補題・定義、section、namespace を自動検出します。</p>
<label class="label" for="githubUrl">GitHub URL</label>
<div class="row"><input id="githubUrl" class="input" placeholder="https://github.com/are4c4/SerreNumberTheoryBlueprint/blob/.../File.lean#L24"><button id="detect" class="btn primary">検出</button></div>
<div id="status" class="status"></div>
<div id="result" class="result">
  <div class="meta"><div class="k">File</div><div id="metaFile" class="v"></div><div class="k">Branch</div><div id="metaBranch" class="v"></div><div class="k">Selected line</div><div id="metaLine" class="v"></div></div>
  <div id="candidates"></div>
  <label class="label" for="notionUrl">Notion表示用URL</label>
  <div class="out"><input id="notionUrl" class="input" readonly><button id="copy" class="btn">コピー</button><button id="open" class="btn">開く</button></div>
</div>
<p class="hint">GitHubでは行番号（例: L24）をクリックすると、URL末尾に <code>#L24</code> が付きます。複数行選択の <code>#L24-L28</code> にも対応します。</p>
</div></div>
<script>
const OWNER='are4c4',REPO='SerreNumberTheoryBlueprint';
const VIEWER='https://are4c4.github.io/SerreNumberTheoryBlueprint/notion/';
const input=document.getElementById('githubUrl'),statusEl=document.getElementById('status'),result=document.getElementById('result'),candidatesEl=document.getElementById('candidates'),out=document.getElementById('notionUrl');
let parsed=null,choices=[];
function status(msg,kind=''){statusEl.textContent=msg;statusEl.className='status '+kind}
function parseGitHubUrl(s){
  const u=new URL(s.trim());
  if(u.hostname!=='github.com')throw new Error('github.com のURLを貼り付けてください。');
  const parts=u.pathname.split('/').filter(Boolean);
  if(parts[0]!==OWNER||parts[1]!==REPO||parts[2]!=='blob')throw new Error('SerreNumberTheoryBlueprint のファイルURLを指定してください。');
  if(parts.length<5)throw new Error('LeanファイルのURLを指定してください。');
  const branch=decodeURIComponent(parts[3]);
  const file=parts.slice(4).map(decodeURIComponent).join('/');
  if(!file.endsWith('.lean'))throw new Error('.lean ファイルを指定してください。');
  const m=u.hash.match(/^#L(\d+)(?:-L(\d+))?$/);
  if(!m)throw new Error('GitHubで行番号をクリックして、#L24 のような行番号付きURLを使ってください。');
  return{branch,file,line:Number(m[1]),endLine:m[2]?Number(m[2]):Number(m[1])};
}
function declAt(lines,line){
  const pat=/^\s*(?:@\[[^\]]*\]\s*)?(?:(?:noncomputable|private|protected)\s+)*(theorem|lemma|example|def|abbrev|instance|structure|class|inductive)\s+([^\s(:{]+)/;
  const top=/^\s*(?:@\[[^\]]*\]\s*)?(?:(?:noncomputable|private|protected)\s+)*(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive|namespace|section|end|variable|variables|universe|open|export|include|omit|attribute|set_option|local\s+instance)\b/;
  let best=null;
  for(let i=0;i<line;i++){const m=lines[i]?.match(pat);if(m)best={type:'decl',kind:m[1],name:m[2],start:i+1}}
  if(!best)return null;
  for(let i=best.start;i<line-1;i++)if(top.test(lines[i]))return null;
  return best;
}
function enclosingScopes(lines,line){
  const stack=[];
  for(let i=0;i<Math.min(line,lines.length);i++){
    let m=lines[i].match(/^\s*(namespace|section)\s+([^\s]+)/);
    if(m)stack.push({type:m[1],kind:m[1],name:m[2],start:i+1});
    if(/^\s*end(?:\s+[^\s]+)?\s*(?:--.*)?$/.test(lines[i])&&stack.length)stack.pop();
  }
  return stack.slice().reverse();
}
function directTarget(lines,line){
  const s=lines[line-1]||'';
  let m=s.match(/^\s*(namespace|section)\s+([^\s]+)/);if(m)return{type:m[1],kind:m[1],name:m[2],start:line};
  m=s.match(/^\s*(?:@\[[^\]]*\]\s*)?(?:(?:noncomputable|private|protected)\s+)*(theorem|lemma|example|def|abbrev|instance|structure|class|inductive)\s+([^\s(:{]+)/);if(m)return{type:'decl',kind:m[1],name:m[2],start:line};
  return null;
}
function makeUrl(c){const u=new URL(VIEWER);u.searchParams.set('file',parsed.file);u.searchParams.set(c.type,c.name);if(parsed.branch!=='notion-display-from-before-miniblueprint-2026-08-26')u.searchParams.set('branch',parsed.branch);return u.toString()}
function setChoice(index){document.querySelectorAll('input[name="choice"]')[index].checked=true;out.value=makeUrl(choices[index])}
async function detect(){
  result.style.display='none';choices=[];status('解析中…');
  try{
    parsed=parseGitHubUrl(input.value);
    const raw=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${encodeURIComponent(parsed.branch)}/${parsed.file.split('/').map(encodeURIComponent).join('/')}?t=${Date.now()}`;
    const r=await fetch(raw,{cache:'no-store'});if(!r.ok)throw new Error(`GitHubソースを取得できませんでした (HTTP ${r.status})`);
    const text=await r.text(),lines=text.split('\n');if(parsed.line>lines.length)throw new Error(`行番号 L${parsed.line} はファイル範囲外です。`);
    const direct=directTarget(lines,parsed.line),decl=declAt(lines,parsed.line),scopes=enclosingScopes(lines,parsed.line);
    const all=[direct,decl,...scopes].filter(Boolean);
    const seen=new Set();choices=all.filter(c=>{const k=`${c.type}:${c.name}`;if(seen.has(k))return false;seen.add(k);return true});
    if(!choices.length)throw new Error('この行から表示対象を特定できませんでした。定理名・section・namespace の行を選択してみてください。');
    document.getElementById('metaFile').textContent=parsed.file;document.getElementById('metaBranch').textContent=parsed.branch;document.getElementById('metaLine').textContent=parsed.endLine===parsed.line?`L${parsed.line}`:`L${parsed.line}-L${parsed.endLine}`;
    candidatesEl.innerHTML='<div class="label">表示対象</div>'+choices.map((c,i)=>`<div class="candidate"><label><input type="radio" name="choice" value="${i}" ${i===0?'checked':''}><span><strong>${c.type==='decl'?c.kind:c.type} ${c.name}</strong><small>line ${c.start}</small></span></label></div>`).join('');
    candidatesEl.querySelectorAll('input[name="choice"]').forEach((el,i)=>el.addEventListener('change',()=>setChoice(i)));
    out.value=makeUrl(choices[0]);result.style.display='block';status('検出しました。','ok');
  }catch(e){status(e.message||String(e),'bad')}
}
document.getElementById('detect').addEventListener('click',detect);input.addEventListener('keydown',e=>{if(e.key==='Enter')detect()});
document.getElementById('copy').addEventListener('click',async()=>{if(!out.value)return;await navigator.clipboard.writeText(out.value);const b=document.getElementById('copy');b.textContent='コピー済み';setTimeout(()=>b.textContent='コピー',1200)});
document.getElementById('open').addEventListener('click',()=>{if(out.value)window.open(out.value,'_blank','noopener')});
const pre=new URLSearchParams(location.search).get('github');if(pre){input.value=pre;detect()}
</script>
</body></html>
