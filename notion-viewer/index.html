<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lean Code Viewer</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7f5;--panel:#fff;--border:#e5e5e0;--text:#2f3437;--muted:#787774;--code-bg:#f3f3f2;--keyword:#7c3aed;--const:#2563eb;--var:#1f2937;--sort:#b45309;--literal:#0f766e;--comment:#6b7280;--punct:#6b7280;--unknown:#374151}
    @media(prefers-color-scheme:dark){:root{--bg:#191919;--panel:#202020;--border:#343434;--text:#e6e6e6;--muted:#aaa;--code-bg:#252525;--keyword:#c4b5fd;--const:#93c5fd;--var:#e5e7eb;--sort:#fcd34d;--literal:#5eead4;--comment:#9ca3af;--punct:#b6bbc5;--unknown:#d1d5db}}
    *{box-sizing:border-box}
    body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .viewer{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
    .filename{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .actions{display:flex;gap:6px;flex-shrink:0}
    button,a.button{border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);padding:5px 8px;font-size:11px;cursor:pointer;text-decoration:none}
    .code-wrap{overflow:auto;background:var(--code-bg)}
    .code-grid{display:grid;grid-template-columns:auto minmax(max-content,1fr);align-items:start;min-width:max-content}
    pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.35;tab-size:2}
    .line-nos{user-select:none;text-align:right;color:var(--muted);padding:6px 10px;border-right:1px solid var(--border)}
    .code-pre{padding:6px 14px;white-space:pre;color:var(--text)}
    .error{padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}

    /* SubVerso semantic token classes. These are produced by Lean itself. */
    .lean-token.keyword,.lean-token.built-in{color:var(--keyword);font-weight:600}
    .lean-token.const,.lean-token.module-name,.lean-token.option{color:var(--const)}
    .lean-token.var,.lean-token.wildcard,.lean-token.typed{color:var(--var)}
    .lean-token.sort,.lean-token.level-var,.lean-token.level-const,.lean-token.level-op{color:var(--sort)}
    .lean-token.literal{color:var(--literal)}
    .lean-token.comment,.lean-token.doc-comment{color:var(--comment);font-style:italic}
    .lean-token.punctuation,.lean-token.delim{color:var(--punct)}
    .lean-token.unknown{color:var(--unknown)}
    .lean-token[title]{text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);cursor:help}
  </style>
</head>
<body>
  <div class="viewer">
    <div class="toolbar">
      <div id="filename" class="filename">Loading…</div>
      <div class="actions">
        <button id="reloadBtn" type="button">Reload</button>
        <button id="copyBtn" type="button">Copy</button>
        <a id="githubBtn" class="button" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
    <div id="codeWrap" class="code-wrap"></div>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const owner='are4c4';
    const repo='SerreNumberTheoryBlueprint';
    const branch=params.get('branch')||'notion-display-from-before-miniblueprint-2026-08-26';
    const file=params.get('file')||'SerreNumberTheory/Formalization/Chapter01/F010101FiniteFields.lean';
    const decl=params.get('decl')||'myFrobenius_injective';
    const codeWrap=document.getElementById('codeWrap');
    const filenameEl=document.getElementById('filename');
    const copyBtn=document.getElementById('copyBtn');
    const reloadBtn=document.getElementById('reloadBtn');
    const githubBtn=document.getElementById('githubBtn');
    let displayedCode='';

    filenameEl.textContent=decl?`${file} — ${decl}`:file;
    githubBtn.href=`https://github.com/${owner}/${repo}/blob/${branch}/${file}`;

    function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
    function moduleNameFromFile(path){return path.replace(/\.lean$/,'').replaceAll('/','.')}
    function declarationMatches(name,target){
      if(name===target)return true;
      if(name.endsWith(`.${target}`))return true;
      const short=target.split('.').at(-1);
      return name===short||name.endsWith(`.${short}`);
    }
    function trimRendered(item){
      // SubVerso may retain leading/trailing whitespace around a command. Trim blank lines only;
      // semantic spans inside the declaration are left untouched.
      let text=item.text||'';
      let html=item.html||'';
      const leading=(text.match(/^(?:[ \t]*\n)+/)||[''])[0];
      const trailing=(text.match(/(?:\n[ \t]*)+$/)||[''])[0];
      if(leading){text=text.slice(leading.length);html=html.replace(/^((?:\s|&nbsp;|<[^>]+>)*)/,'')}
      if(trailing)text=text.slice(0,-trailing.length);
      return{...item,text,html};
    }
    function renderSemantic(item){
      const x=trimRendered(item);
      displayedCode=x.text;
      const lines=x.text.split('\n');
      while(lines.length>1&&lines.at(-1)==='')lines.pop();
      const first=x.startLine||1;
      const nums=lines.map((_,i)=>first+i).join('\n');
      codeWrap.innerHTML=`<div class="code-grid"><pre class="line-nos">${nums}</pre><pre class="code-pre">${x.html}</pre></div>`;
    }

    // Fallback highlighter used only if semantic data is unavailable.
    function highlightFallback(line){
      let h=escapeHtml(line),i=h.indexOf('--'),c=i>=0?h.slice(0,i):h,cm=i>=0?h.slice(i):'';
      c=c.replace(/\b(theorem|lemma|example|def|abbrev|structure|class|instance|namespace|section|end|variable|variables|universe|open|export|noncomputable|private|protected|mutual|where|deriving|inductive|omit|include)\b/g,'<span class="lean-token keyword">$1</span>');
      c=c.replace(/\b(import|by|simp|simpa|rw|rfl|exact|apply|intro|intros|constructor|cases|induction|have|show|calc|refine|rcases|aesop|omega|linarith|norm_num|ring|field_simp|positivity|decide)\b/g,'<span class="lean-token keyword">$1</span>');
      if(cm)c+=`<span class="lean-token comment">${cm}</span>`;
      return c;
    }
    function extractDeclaration(source,name){
      const lines=source.split('\n');
      const declPattern=/^\s*(?:@\[[^\]]*\]\s*)?(?:noncomputable\s+)?(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive)\s+([^\s(:{]+)/;
      const topLevelCommand=/^(?:@\[[^\]]*\]\s*)?(?:(?:noncomputable|private|protected)\s+)?(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive|namespace|section|end|variable|variables|universe|open|export|include|omit|attribute|set_option|local\s+instance)\b/;
      let start=-1;
      for(let i=0;i<lines.length;i++){const m=lines[i].match(declPattern);if(m&&m[1]===name){start=i;break}}
      if(start===-1)throw new Error(`Declaration "${name}" was not found in ${file}.`);
      let end=lines.length;
      for(let i=start+1;i<lines.length;i++){if(topLevelCommand.test(lines[i])){end=i;break}}
      while(end>start&&lines[end-1].trim()==='')end--;
      return{code:lines.slice(start,end).join('\n'),startLine:start+1};
    }
    function renderFallback(code,firstLine=1){
      displayedCode=code;
      const rows=code.split('\n').map((line,index)=>`<tr><td>${firstLine+index}</td><td>${highlightFallback(line)||'&nbsp;'}</td></tr>`).join('');
      codeWrap.innerHTML=`<table style="border-collapse:collapse;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.35"><tbody>${rows}</tbody></table>`;
      [...codeWrap.querySelectorAll('td:nth-child(1)')].forEach(td=>{td.style.cssText='user-select:none;width:1%;min-width:42px;padding:3px 10px;text-align:right;color:var(--muted);border-right:1px solid var(--border);vertical-align:top'});
      [...codeWrap.querySelectorAll('td:nth-child(2)')].forEach(td=>{td.style.cssText='padding:3px 14px;white-space:pre;vertical-align:top'});
    }
    async function loadFallback(){
      const u=`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file}?t=${Date.now()}`;
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok)throw new Error(`HTTP ${r.status}: ${r.statusText}`);
      const source=await r.text();
      const x=decl?extractDeclaration(source,decl):{code:source,startLine:1};
      renderFallback(x.code,x.startLine);
    }
    async function loadCode(){
      codeWrap.innerHTML='<div class="error">Loading semantic Lean highlighting…</div>';
      try{
        const moduleName=moduleNameFromFile(file);
        const u=`../notion-data/${moduleName}.json?t=${Date.now()}`;
        const r=await fetch(u,{cache:'no-store'});
        if(!r.ok)throw new Error(`Semantic data HTTP ${r.status}`);
        const data=await r.json();
        const item=decl?data.items.find(it=>(it.defines||[]).some(name=>declarationMatches(name,decl))):null;
        if(decl&&!item)throw new Error(`Semantic declaration "${decl}" was not found.`);
        if(item)renderSemantic(item);else await loadFallback();
      }catch(e){
        console.warn('Semantic highlighting unavailable; using fallback.',e);
        try{await loadFallback()}catch(e2){codeWrap.innerHTML=`<div class="error">${escapeHtml(String(e2))}</div>`}
      }
    }
    reloadBtn.addEventListener('click',loadCode);
    copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(displayedCode);copyBtn.textContent='Copied!';setTimeout(()=>copyBtn.textContent='Copy',1200)}catch{copyBtn.textContent='Copy failed'}});
    loadCode();
  </script>
</body>
</html>
