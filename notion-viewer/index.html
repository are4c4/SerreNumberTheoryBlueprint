<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lean Code Viewer</title>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--panel:#181818;--border:#3c3c3c;--text:#d4d4d4;--muted:#858585;--code:#1e1e1e;--keyword:#c586c0;--decl:#dcdcaa;--fn:#4fc1ff;--type:#4ec9b0;--member:#ce9178;--var:#9cdcfe;--literal:#b5cea8;--comment:#6a9955}
*{box-sizing:border-box}body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.viewer{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-bottom:1px solid var(--border);background:#181818}.heading{min-width:0}.file-label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}.file-name{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#a9a9a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.target-row{display:flex;align-items:baseline;gap:7px;margin-top:7px;min-width:0}.target-badge{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#b4b4b4;background:#252526;border:1px solid #3c3c3c;border-radius:4px;padding:2px 5px}.target-name{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:#e7e7e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:6px;flex-shrink:0}button,a.button{border:1px solid #454545;border-radius:6px;background:#252526;color:#ccc;padding:5px 8px;font-size:11px;text-decoration:none;cursor:pointer}button:hover,a.button:hover{background:#2d2d30}
.code-wrap{overflow:auto;background:var(--code)}.code-grid{display:grid;grid-template-columns:auto minmax(max-content,1fr);align-items:start;min-width:max-content}pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.45;tab-size:2}.line-nos{user-select:none;text-align:right;color:var(--muted);padding:8px 10px;border-right:1px solid #333;background:#1e1e1e}.code-pre{padding:8px 14px;white-space:pre;color:var(--text);background:#1e1e1e}.error,.empty{padding:18px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;background:#1e1e1e}.empty code{background:#252526;border:1px solid #3c3c3c;border-radius:4px;padding:2px 4px}
.context-separator{opacity:.55}.lean-token.keyword,.lean-token.built-in{color:var(--keyword);font-weight:600}.lean-token.declaration{color:var(--decl)!important;font-weight:650}.lean-token.function-like,.lean-token.const,.lean-token.option{color:var(--fn)}.lean-token.predicate-like,.lean-token.type-like,.lean-token.sort{color:var(--type)}.lean-token.member-like{color:var(--member)!important}.lean-token.var,.lean-token.wildcard,.lean-token.typed{color:var(--var)}.lean-token.literal{color:var(--literal)}.lean-token.comment,.lean-token.doc-comment{color:var(--comment);font-style:italic}.lean-token[title]{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
</style>
</head>
<body>
<div class="viewer">
  <div class="header">
    <div class="heading">
      <div class="file-label">Lean file</div>
      <div id="fileName" class="file-name">Lean Code Viewer</div>
      <div id="targetRow" class="target-row" hidden><span id="targetBadge" class="target-badge"></span><span id="targetName" class="target-name"></span></div>
    </div>
    <div class="actions"><button id="reloadBtn">Reload</button><button id="copyBtn">Copy</button><a id="githubBtn" class="button" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
  </div>
  <div id="codeWrap" class="code-wrap"></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const owner='are4c4',repo='SerreNumberTheoryBlueprint';
const branch=params.get('branch')||'notion-display-from-before-miniblueprint-2026-08-26';
const file=params.get('file')||'SerreNumberTheory/Formalization/Chapter01/F010101FiniteFields.lean';
const decl=params.get('decl'),sectionName=params.get('section'),namespaceName=params.get('namespace');
const targets=[['decl',decl],['section',sectionName],['namespace',namespaceName]].filter(([,v])=>v);
const targetType=targets.length===1?targets[0][0]:null,targetName=targets.length===1?targets[0][1]:null;
const codeWrap=document.getElementById('codeWrap'),copyBtn=document.getElementById('copyBtn');let displayedCode='';
document.getElementById('fileName').textContent=file;
document.getElementById('githubBtn').href=`https://github.com/${owner}/${repo}/blob/${branch}/${file}`;
if(targetType){document.getElementById('targetRow').hidden=false;document.getElementById('targetBadge').textContent=targetType;document.getElementById('targetName').textContent=targetName}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const moduleName=p=>p.replace(/\.lean$/,'').replaceAll('/','.');
function declarationMatches(name,target){if(name===target||name.endsWith(`.${target}`))return true;const short=target.split('.').at(-1);return name===short||name.endsWith(`.${short}`)}
function showEmpty(msg){displayedCode='';copyBtn.disabled=true;codeWrap.innerHTML=`<div class="empty"><strong>${msg||'表示する Lean コードを指定してください。'}</strong><br><br>宣言: <code>?file=...&amp;decl=myTheorem</code><br>section: <code>?file=...&amp;section=MySection</code><br>namespace: <code>?file=...&amp;namespace=MyNamespace</code></div>`}
function previousText(el){let n=el.previousSibling;while(n){if((n.textContent||'').length)return n.textContent||'';n=n.previousSibling}return ''}
function enrich(html,item){const host=document.createElement('div');host.innerHTML=html;const defined=(item.defines||[]).flatMap(x=>[x,x.split('.').at(-1)]);host.querySelectorAll('.lean-token.const,[data-semantic="constructor"]').forEach(el=>{const txt=(el.textContent||'').trim(),full=el.dataset.constName||'',sig=(el.dataset.signature||el.title||'').trim(),short=full.split('.').at(-1)||'';if(defined.includes(txt)||defined.includes(short)){el.classList.add('declaration');return}if(previousText(el).trimEnd().endsWith('.')){el.classList.add('member-like');return}if(/(?:^|[\s(:→])Prop\b|:\s*Prop\b|→\s*Prop\b/.test(sig)){el.classList.add('predicate-like');return}if(/(?:^|[\s(:→])(?:Type|Sort)\b|:\s*(?:Type|Sort)\b|→\s*(?:Type|Sort)\b/.test(sig)||/^[A-ZΑ-Ω]/u.test(txt.split('.').at(-1)||txt)){el.classList.add('type-like');return}el.classList.add('function-like')});host.querySelectorAll('[data-semantic="variable"]').forEach(el=>el.classList.add('var'));host.querySelectorAll('[data-semantic="number"],[data-semantic="string"],[data-semantic="char"]').forEach(el=>el.classList.add('literal'));host.querySelectorAll('[data-semantic="comment"],[data-semantic="doc-comment"]').forEach(el=>el.classList.add('comment'));return host.innerHTML}
function trimItem(item){let text=item.text||'',html=item.html||'';const lead=(text.match(/^(?:[ \t]*\n)+/)||[''])[0],trail=(text.match(/(?:\n[ \t]*)+$/)||[''])[0];if(lead){text=text.slice(lead.length);html=html.replace(/^((?:\s|&nbsp;|<[^>]+>)*)/,'')}if(trail)text=text.slice(0,-trail.length);return{...item,text,html}}
function fallback(line){let h=esc(line),i=h.indexOf('--'),c=i>=0?h.slice(0,i):h,cm=i>=0?h.slice(i):'';c=c.replace(/\b(theorem|lemma|example|def|abbrev|structure|class|instance|namespace|section|end|variable|variables|universe|open|export|noncomputable|private|protected|mutual|where|deriving|inductive|omit|include|in)\b/g,'<span class="lean-token keyword">$1</span>');c=c.replace(/\b(import|by|simp|simpa|rw|rfl|exact|apply|intro|intros|constructor|cases|induction|have|show|calc|refine|rcases|aesop|omega|linarith|norm_num|ring|field_simp|positivity|decide)\b/g,'<span class="lean-token keyword">$1</span>');c=c.replace(/\b(Type\*?|Prop|Sort|Nat|Int|ℕ|ℤ)\b/g,'<span class="lean-token type-like">$1</span>');if(cm)c+=`<span class="lean-token comment">${cm}</span>`;return c}
function renderRows(rows,text){displayedCode=text;copyBtn.disabled=false;codeWrap.innerHTML=`<div class="code-grid"><pre class="line-nos">${rows.map(r=>r.lineNo??'').join('\n')}</pre><pre class="code-pre">${rows.map(r=>r.html||'').join('\n')}</pre></div>`}
function extractDecl(source,name){const lines=source.split('\n'),pat=/^\s*(?:@\[[^\]]*\]\s*)?(?:noncomputable\s+)?(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive)\s+([^\s(:{]+)/,top=/^(?:@\[[^\]]*\]\s*)?(?:(?:noncomputable|private|protected)\s+)?(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive|namespace|section|end|variable|variables|universe|open|export|include|omit|attribute|set_option|local\s+instance)\b/;let start=-1;for(let i=0;i<lines.length;i++){const m=lines[i].match(pat);if(m&&m[1]===name){start=i;break}}if(start<0)throw new Error(`Declaration "${name}" was not found.`);let end=lines.length;for(let i=start+1;i<lines.length;i++){if(top.test(lines[i])){end=i;break}}while(end>start&&lines[end-1].trim()==='')end--;return{code:lines.slice(start,end).join('\n'),startLine:start+1,endLine:end}}
function extractDeclDisplay(source,name){const lines=source.split('\n'),base=extractDecl(source,name);let start=base.startLine-1;
  let i=start-1;
  if(i>=0&&/^\s*-\/\s*$/.test(lines[i])){let j=i;while(j>=0&&!/^\s*\/--?/.test(lines[j]))j--;if(j>=0){start=j;i=j-1}}
  while(i>=0&&(/^\s*(?:include|omit)\b.*\bin\s*$/.test(lines[i])||/^\s*@\[.*\]\s*$/.test(lines[i]))){start=i;i--}
  return{code:lines.slice(start,base.endLine).join('\n'),startLine:start+1,endLine:base.endLine,theoremStartLine:base.startLine,theoremCode:base.code}}
function extractScope(source,kind,name){const lines=source.split('\n'),target=new RegExp(`^\\s*${kind}\\s+${escRe(name)}(?:\\s|$)`);let start=-1;for(let i=0;i<lines.length;i++)if(target.test(lines[i])){start=i;break}if(start<0)throw new Error(`${kind} "${name}" was not found.`);let depth=1,end=-1;for(let i=start+1;i<lines.length;i++){if(/^\s*(?:namespace|section)\b/.test(lines[i]))depth++;if(/^\s*end(?:\s+[^\s]+)?\s*(?:--.*)?$/.test(lines[i])){depth--;if(depth===0){end=i;break}}}if(end<0)throw new Error(`Matching end for ${kind} "${name}" was not found.`);return{code:lines.slice(start,end+1).join('\n'),startLine:start+1}}
function ids(text){return new Set(text.match(/[A-Za-z_][A-Za-z0-9_']*/g)||[])}
function declaredNames(line){const out=[];for(const m of line.matchAll(/[({]\s*([A-Za-z_][A-Za-z0-9_']*(?:\s+[A-Za-z_][A-Za-z0-9_']*)*)\s*:/g))out.push(...m[1].trim().split(/\s+/));return out}
function activeVars(source,before){const lines=source.split('\n'),scopes=[[]];for(let i=0;i<Math.min(before-1,lines.length);i++){const line=lines[i];if(/^\s*end(?:\s+[^\s]+)?\s*(?:--.*)?$/.test(line)){if(scopes.length>1)scopes.pop();continue}if(/^\s*(?:namespace|section)\b/.test(line)){scopes.push([]);continue}if(/^\s*variables?\b/.test(line))scopes.at(-1).push({lineNo:i+1,text:line,names:declaredNames(line)})}return scopes.flat()}
function relevantVars(source,before,declText){const c=activeVars(source,before);if(!c.length)return[];const all=new Set(c.flatMap(x=>x.names)),need=ids(declText),sel=new Set();let changed=true;while(changed){changed=false;for(let i=c.length-1;i>=0;i--){if(sel.has(i))continue;const refs=ids(c[i].text);if(c[i].names.some(n=>need.has(n))){sel.add(i);changed=true;for(const r of refs)if(all.has(r))need.add(r)}}}return c.filter((_,i)=>sel.has(i))}
function overlaySemantic(block,data){const src=block.code.split('\n'),html=src.map(fallback);if(!data)return html;for(const item of data.items||[]){const x=trimItem(item);if(!x.text||!x.startLine)continue;const start=x.startLine-block.startLine;if(start<0||start>=html.length)continue;const sem=enrich(x.html,x).split('\n'),txt=x.text.split('\n');for(let j=0;j<Math.min(sem.length,txt.length);j++){const k=start+j;if(k>=0&&k<html.length)html[k]=sem[j]}}return html}
function renderDeclWithContext(source,data){const base=extractDecl(source,targetName),block=extractDeclDisplay(source,targetName),vars=relevantVars(source,base.startLine,base.code),rows=[];
  for(const v of vars)rows.push({lineNo:v.lineNo,html:fallback(v.text)});
  if(vars.length)rows.push({lineNo:null,html:'<span class="context-separator"></span>'});
  const html=overlaySemantic(block,data),lines=block.code.split('\n');for(let i=0;i<lines.length;i++)rows.push({lineNo:block.startLine+i,html:html[i]||fallback(lines[i])});
  renderRows(rows,(vars.length?vars.map(v=>v.text).join('\n')+'\n\n':'')+block.code)}
function renderBlock(block,data){const html=overlaySemantic(block,data);renderRows(html.map((h,i)=>({lineNo:block.startLine+i,html:h})),block.code)}
async function fetchSource(){const r=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`Source HTTP ${r.status}`);return r.text()}
async function fetchSemantic(){const r=await fetch(`../notion-data/${moduleName(file)}.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`Semantic data HTTP ${r.status}`);return r.json()}
async function load(){if(targets.length===0){showEmpty();return}if(targets.length>1){showEmpty('表示対象は1つだけ指定してください。');return}codeWrap.innerHTML='<div class="error">Loading Lean highlighting…</div>';try{const source=await fetchSource();if(targetType==='decl'){try{renderDeclWithContext(source,await fetchSemantic())}catch(e){console.warn(e);renderDeclWithContext(source,null)}return}const b=extractScope(source,targetType,targetName);try{renderBlock(b,await fetchSemantic())}catch(e){console.warn(e);renderBlock(b,null)}}catch(e){codeWrap.innerHTML=`<div class="error">${esc(String(e))}</div>`}}
document.getElementById('reloadBtn').addEventListener('click',load);copyBtn.addEventListener('click',async()=>{if(!displayedCode)return;try{await navigator.clipboard.writeText(displayedCode);copyBtn.textContent='Copied!';setTimeout(()=>copyBtn.textContent='Copy',1200)}catch{copyBtn.textContent='Copy failed'}});load();
</script>
</body>
</html>
