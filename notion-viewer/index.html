<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lean Code Viewer</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7f5;--panel:#fff;--border:#e5e5e0;--text:#2f3437;--muted:#787774;--code-bg:#f3f3f2;--kw:#7c3aed;--cmd:#2563eb;--type:#b45309;--comment:#6b7280}
    @media(prefers-color-scheme:dark){:root{--bg:#191919;--panel:#202020;--border:#343434;--text:#e6e6e6;--muted:#aaa;--code-bg:#252525;--kw:#c4b5fd;--cmd:#93c5fd;--type:#fcd34d;--comment:#9ca3af}}
    *{box-sizing:border-box}body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.viewer{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}.filename{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px;flex-shrink:0}button,a.button{border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text);padding:5px 8px;font-size:11px;cursor:pointer;text-decoration:none}.code-wrap{overflow:auto;background:var(--code-bg)}table{border-collapse:collapse;width:100%}td{vertical-align:top;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.2}td.line-no{user-select:none;width:1%;min-width:42px;padding:3px 10px;text-align:right;color:var(--muted);border-right:1px solid var(--border)}td.code-line{padding:3px 14px;white-space:pre}.kw{color:var(--kw);font-weight:600}.cmd{color:var(--cmd);font-weight:600}.type{color:var(--type)}.comment{color:var(--comment);font-style:italic}.error{padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="viewer">
    <div class="toolbar">
      <div id="filename" class="filename">Loading…</div>
      <div class="actions">
        <button id="reloadBtn" type="button">Reload</button>
        <button id="copyBtn" type="button">Copy</button>
        <a id="githubBtn" class="button" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
    <div id="codeWrap" class="code-wrap"></div>
  </div>
  <script>
    const params=new URLSearchParams(location.search);
    const owner='are4c4';
    const repo='SerreNumberTheoryBlueprint';
    const branch=params.get('branch')||'notion-display-from-before-miniblueprint-2026-08-26';
    const file=params.get('file')||'SerreNumberTheory/Formalization/Chapter01/F010101FiniteFields.lean';
    const decl=params.get('decl')||'myFrobenius_injective';
    const codeWrap=document.getElementById('codeWrap');
    const filenameEl=document.getElementById('filename');
    const copyBtn=document.getElementById('copyBtn');
    const reloadBtn=document.getElementById('reloadBtn');
    const githubBtn=document.getElementById('githubBtn');
    let displayedCode='';
    filenameEl.textContent=decl?`${file} — ${decl}`:file;
    githubBtn.href=`https://github.com/${owner}/${repo}/blob/${branch}/${file}`;
    function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
    function highlightLean(line){let h=escapeHtml(line),i=h.indexOf('--'),c=i>=0?h.slice(0,i):h,cm=i>=0?h.slice(i):'';c=c.replace(/\b(theorem|lemma|example|def|abbrev|structure|class|instance|namespace|section|end|variable|variables|universe|open|export|noncomputable|private|protected|mutual|where|deriving|inductive|omit|include)\b/g,'<span class="kw">$1</span>');c=c.replace(/\b(import|by|simp|simpa|rw|rfl|exact|apply|intro|intros|constructor|cases|induction|have|show|calc|refine|rcases|aesop|omega|linarith|norm_num|ring|field_simp|positivity|decide)\b/g,'<span class="cmd">$1</span>');c=c.replace(/\b(Type|Prop|Nat|Int|Rat|Real|Complex|Fin|Set|Field|Ring|Group|Monoid|AddGroup|CommRing|IntegralDomain|Function)\b/g,'<span class="type">$1</span>');if(cm)c+=`<span class="comment">${cm}</span>`;return c}
    function extractDeclaration(source,name){const lines=source.split('\n');const p=/^\s*(?:@\[[^\]]*\]\s*)?(?:noncomputable\s+)?(?:theorem|lemma|example|def|abbrev|instance|structure|class|inductive)\s+([^\s(:{]+)/;let start=-1;for(let i=0;i<lines.length;i++){const m=lines[i].match(p);if(m&&m[1]===name){start=i;break}}if(start===-1)throw new Error(`Declaration "${name}" was not found in ${file}.`);let end=lines.length;for(let i=start+1;i<lines.length;i++){if(lines[i].match(p)){end=i;break}}while(end>start&&lines[end-1].trim()==='')end--;return{code:lines.slice(start,end).join('\n'),startLine:start+1}}
    function renderCode(code,firstLine=1){displayedCode=code;const rows=code.split('\n').map((line,index)=>`<tr><td class="line-no">${firstLine+index}</td><td class="code-line">${highlightLean(line)||'&nbsp;'}</td></tr>`).join('');codeWrap.innerHTML=`<table><tbody>${rows}</tbody></table>`}
    async function loadCode(){codeWrap.innerHTML='<div class="error">Loading…</div>';const u=`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file}?t=${Date.now()}`;try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}: ${r.statusText}`);const source=await r.text();if(decl){const x=extractDeclaration(source,decl);renderCode(x.code,x.startLine)}else renderCode(source,1)}catch(e){codeWrap.innerHTML=`<div class="error">${escapeHtml(String(e))}</div>`}}
    reloadBtn.addEventListener('click',loadCode);
    copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(displayedCode);copyBtn.textContent='Copied!';setTimeout(()=>copyBtn.textContent='Copy',1200)}catch{copyBtn.textContent='Copy failed'}});
    loadCode();
  </script>
</body>
</html>
